name: microscopio_usb
description: Aplicativo Flutter para microscópio USB/UVC.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_ffi_uvc: ^0.12.0
  gal: ^2.3.3
  share_plus: ^12.0.1
  path_provider: ^2.2.0
  shared_preferences: ^2.2.0
  google_mlkit_image_labeling: ^0.16.1
  google_mlkit_commons: ^0.13.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/microscopio_hero.png
