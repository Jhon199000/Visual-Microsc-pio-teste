workflows:
  android-release:
    name: Visual Microscópio - Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: 3.47.2

    scripts:
      - name: DIAGNÓSTICO - estrutura do projeto
        script: |
          set -e
          echo "=== DIRETÓRIO ATUAL ==="
          pwd
          ls -la
          flutter --version

      - name: Patch Flutter Gradle lockfile
        script: |
          set -e
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          PLUGIN="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterPlugin.kt"

          echo "Flutter root: $FLUTTER_ROOT"
          echo "Plugin path: $PLUGIN"

          if [ ! -f "$PLUGIN" ]; then
            echo "Arquivo não encontrado, pulando patch"
            exit 0
          fi

          # Aplica o patch de forma simples
          if grep -q 'findByName("generateLockfiles")' "$PLUGIN"; then
            echo "Patch já existe"
          else
            echo "Aplicando patch..."
            python3 -c '
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text()
          old = """private fun addTaskForLockfileGeneration(rootProject: Project) {
              rootProject.tasks.register(\"generateLockfiles\") {"""
          new = """private fun addTaskForLockfileGeneration(rootProject: Project) {
              if (rootProject.tasks.findByName(\"generateLockfiles\") != null) {
                  return
              }
              rootProject.tasks.register(\"generateLockfiles\") {"""
          if old in text:
              path.write_text(text.replace(old, new))
              print("Patch aplicado com sucesso")
          else:
              print("Padrão não encontrado, tentando outro método")
          ' "$PLUGIN"
          fi

      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get

      - name: Build APK (release)
        script: |
          set -e
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
