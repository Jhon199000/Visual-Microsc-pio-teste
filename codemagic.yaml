workflows:

  android-release:

    name: Microscópio USB - Android Release

    max_build_duration: 60


    environment:

      flutter: 3.35.1

      java: 17


      vars:

        PACKAGE_NAME: "com.microscopiousb"


    scripts:


      - name: Mostrar ambiente

        script: |

          set -e

          echo "========== FLUTTER =========="

          flutter --version

          echo "========== JAVA =========="

          java -version

          echo "========== DIRETÓRIO DO PROJETO =========="

          pwd

          echo "========== ARQUIVOS =========="

          ls -la

          echo "========== ANDROID =========="

          ls -la android || true



      - name: Preparar local.properties

        script: |

          set -e

          mkdir -p "$CM_BUILD_DIR/android"

          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"



      - name: Limpar projeto

        script: |

          set -e

          flutter clean

          rm -rf "$CM_BUILD_DIR/build"

          rm -rf "$CM_BUILD_DIR/.dart_tool"



      - name: Baixar dependências

        script: |

          set -e

          flutter pub get



      - name: Verificar dependências

        script: |

          set -e

          flutter pub deps



      - name: Analisar código

        script: |

          set -e

          flutter analyze --no-fatal-infos



      - name: Build APK Release

        script: |

          set -e

          flutter build apk --release --verbose



    artifacts:

      - build/app/outputs/flutter-apk/*.apk

      - build/app/outputs/**/mapping.txt
