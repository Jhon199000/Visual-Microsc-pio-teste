workflows:
  android-visual:
    name: Microscópio USB - Visual V1
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Instalar dependências
        script: |
          flutter pub get

      - name: Gerar APK de teste
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
