workflows:
  android-release:
    name: Visual Microscópio - Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: 3.47.2

    scripts:
      - name: DIAGNÓSTICO - estrutura do projeto
        script: |
          set -e
          echo "=== DIRETÓRIO ATUAL ==="
          pwd
          ls -la
          flutter --version

      - name: Patch generateLockfiles
        script: |
          set -e
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          echo "Flutter root: $FLUTTER_ROOT"

          PLUGIN="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterPlugin.kt"

          if [ -f "$PLUGIN" ]; then
            echo "Aplicando patch em: $PLUGIN"
            cp "$PLUGIN" "$PLUGIN.bak"

            sed -i 's/rootProject\.tasks\.register("generateLockfiles")/if (rootProject.tasks.findByName("generateLockfiles") == null) rootProject.tasks.register("generateLockfiles")/g' "$PLUGIN"
            sed -i "s/rootProject\.tasks\.register('generateLockfiles')/if (rootProject.tasks.findByName(\"generateLockfiles\") == null) rootProject.tasks.register(\"generateLockfiles\")/g" "$PLUGIN"

            echo "Patch aplicado"
          else
            echo "Arquivo FlutterPlugin.kt não encontrado, pulando patch"
          fi

      - name: Limpeza
        script: |
          set -e
          flutter clean
          rm -rf android/.gradle build .dart_tool

      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get

      - name: Build APK (release)
        script: |
          set -e
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
