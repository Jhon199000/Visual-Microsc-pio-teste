workflows:
  android-release:
    name: Microscópio USB - Build Android
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: 3.47.2
      java: 17
      vars:
        PACKAGE_NAME: "com.microscopiousb"

    scripts:
      - name: Preparar ambiente Android
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/android"
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          flutter --version
          java -version

      - name: Limpar build anterior
        script: |
          set -e
          flutter clean
          rm -rf "$CM_BUILD_DIR/build" "$CM_BUILD_DIR/.dart_tool"

      - name: Obter dependências
        script: |
          set -e
          flutter pub get

      - name: Verificar projeto
        script: |
          set -e
          flutter analyze --no-fatal-infos

      - name: Build APK Release
        script: |
          set -e
          flutter build apk --release --verbose

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/mapping.txt
