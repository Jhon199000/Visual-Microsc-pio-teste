workflows:
  android-release:
    name: Visual Microscópio - Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    # O projeto Flutter está dentro da pasta "microscopio".
    # Todos os scripts abaixo serão executados a partir dela.
    working_directory: microscopio

    environment:
      flutter: 3.47.2

    scripts:
      - name: Diagnóstico - diretório e projeto Flutter
        script: |
          set -e
          echo "=== DIRETÓRIO ATUAL ==="
          pwd

          echo "=== CONTEÚDO DO DIRETÓRIO ==="
          ls -la

          echo "=== PUBSPEC ==="
          if [ -f pubspec.yaml ]; then
            echo "OK: pubspec.yaml encontrado em $(pwd)"
          else
            echo "ERRO: pubspec.yaml NÃO encontrado em $(pwd)"
            exit 1
          fi

          echo "=== FLUTTER ==="
          flutter --version

      - name: Patch Flutter Gradle lockfile task collision
        script: |
          set -e

          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          PLUGIN="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterPlugin.kt"

          echo "Flutter root: $FLUTTER_ROOT"
          echo "FlutterPlugin.kt: $PLUGIN"

          if [ ! -f "$PLUGIN" ]; then
            echo "ERRO: FlutterPlugin.kt não encontrado."
            exit 1
          fi

          python3 - "$PLUGIN" <<'PY'
          import sys
          from pathlib import Path

          plugin = Path(sys.argv[1])
          text = plugin.read_text(encoding="utf-8")

          marker = "private fun addTaskForLockfileGeneration(rootProject: Project)"
          start = text.find(marker)

          if start == -1:
              print("Função de lockfile não encontrada; nenhum patch aplicado.")
              raise SystemExit(0)

          next_marker = "    private fun addFlutterTasks(projectToAddTasksTo: Project)"
          end = text.find(next_marker, start)

          if end == -1:
              print("Limite da função não encontrado; não vou alterar o SDK.")
              raise SystemExit(1)

          old = text[start:end]

          if 'findByName("generateLockfiles")' in old:
              print("Patch já está aplicado.")
              raise SystemExit(0)

          replacement = '''private fun addTaskForLockfileGeneration(rootProject: Project) {
              if (rootProject.tasks.findByName("generateLockfiles") != null) {
                  return
              }
              rootProject.tasks.register("generateLockfiles") {
                  doLast {
                      rootProject.subprojects.forEach { subproject ->
                          val gradlew: String = getExecutableNameForPlatform("${rootProject.projectDir}/gradlew")
                          val execOps = rootProject.serviceOf<ExecOperations>()
                          execOps.exec {
                              workingDir(rootProject.projectDir)
                              executable(gradlew)
                              args(":${subproject.name}:dependencies", "--write-locks")
                          }
                      }
                  }
              }
          }

          '''

          plugin.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          print("Patch aplicado com sucesso.")
          PY

      - name: Get Flutter packages
        script: |
          set -e
          echo "Executando flutter pub get em:"
          pwd
          flutter pub get

      - name: Build APK (release)
        script: |
          set -e
          echo "Executando Flutter build em:"
          pwd
          flutter build apk --release --split-per-abi

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/mapping.txt
