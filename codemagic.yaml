workflows:
  android-release:
    name: Visual Microscópio - Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: 3.29.2

    scripts:
      - name: DIAGNÓSTICO - estrutura do projeto
        script: |
          set -e
          echo "=== DIRETÓRIO ATUAL ==="
          pwd
          echo ""
          ls -la
          echo ""
          echo "=== Verificando arquivos ==="
          test -f pubspec.yaml && echo "✓ pubspec.yaml OK" || (echo "ERRO: pubspec.yaml não encontrado" && exit 1)
          test -d lib && echo "✓ pasta lib OK" || (echo "ERRO: pasta lib não encontrada" && exit 1)
          test -d android && echo "✓ pasta android OK" || (echo "ERRO: pasta android não encontrada" && exit 1)
          flutter --version

      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get

      - name: Build APK (release)
        script: |
          set -e
          flutter build apk --release --split-per-abi

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
