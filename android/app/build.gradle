plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.microscopiousb"
    compileSdk 36
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "com.microscopiousb"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            // When a Codemagic Android keystore is configured, Codemagic
            // exposes these values through CM_* environment variables.
            def cmKeystorePath = System.getenv("CM_KEYSTORE_PATH")
            def cmKeystorePassword = System.getenv("CM_KEYSTORE_PASSWORD")
            def cmKeyAlias = System.getenv("CM_KEY_ALIAS")
            def cmKeyPassword = System.getenv("CM_KEY_PASSWORD")

            if (cmKeystorePath && cmKeystorePassword && cmKeyAlias && cmKeyPassword) {
                storeFile file(cmKeystorePath)
                storePassword cmKeystorePassword
                keyAlias cmKeyAlias
                keyPassword cmKeyPassword
            } else {
                // Allows the project to build in Codemagic before a production
                // keystore has been uploaded. This fallback uses the standard
                // Android debug key and is NOT suitable for Google Play release.
                initWith signingConfigs.debug
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source "../.."
}
